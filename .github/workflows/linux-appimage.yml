# G Nexus — AppImage for Linux (Bazzite, Fedora, Ubuntu, Arch…).
#
# - A release published on GitHub: the AppImage is built from its tag and attached to it.
# - "Run workflow" (Actions tab): test build, downloadable from the run's artifacts.
#
# Built on Ubuntu 22.04: its old glibc lets the AppImage run on nearly every distribution
# (recommended base for Tauri AppImages).

name: AppImage Linux

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    env:
      # .cargo/config.toml names a build directory of the author's Windows machine
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libudev-dev libfuse2 patchelf

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release -p g13-core -p g13-daemon -p g13-dsp -p logi-hidpp -p g13-gui

      - name: AppImage
        working-directory: crates/g13-gui
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage

      - name: Name
        id: name
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/g13-gui/Cargo.toml | head -1)
          file="gnexus_${version}_x86_64.AppImage"
          mv target/release/bundle/appimage/*.AppImage "$file"
          sha256sum "$file" > "$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: |
            ${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.file }}.sha256

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.name.outputs.file }}" "${{ steps.name.outputs.file }}.sha256" --clobber
